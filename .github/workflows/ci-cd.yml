name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Backend Tests
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci

    - name: Run backend linter
      working-directory: ./backend
      run: npm run lint || true

    - name: Run backend tests
      working-directory: ./backend
      run: npm test || true

  # Frontend Tests
  frontend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run frontend linter
      working-directory: ./frontend
      run: npm run lint || true

    - name: Run frontend tests
      working-directory: ./frontend
      run: npm test -- --watchAll=false || true

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

  # Python Document Processor Tests
  document-processor-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      working-directory: ./document-processor
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Python linter
      working-directory: ./document-processor
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

  # Docker Build Test
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, document-processor-test]

    steps:
    - uses: actions/checkout@v3

    - name: Build backend Docker image
      run: docker build -f backend/Dockerfile ./backend

    - name: Build frontend Docker image
      run: docker build -f frontend/Dockerfile ./frontend

    - name: Build document processor Docker image
      run: docker build -f document-processor/Dockerfile ./document-processor

  # Deploy (only on main branch)
  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to production
      run: echo "Deploy step - configure based on your hosting provider (AWS/Azure/etc)"
